name: CI/CD — Backend → Azure

on:
  push:
    branches: [ main ]

jobs:
  migrate-staging:
    name: Migrate — Staging
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Prisma migrations on Staging
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Running prisma migrate deploy against STAGING"
          npx prisma migrate deploy

      - name: Log applied migrations (staging)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Listing last 10 applied migrations (staging)..."
          psql "$DATABASE_URL" -Atc "SELECT migration_name || ' | ' || finished_at FROM \"_prisma_migrations\" ORDER BY finished_at DESC LIMIT 10;" || echo "_prisma_migrations table not found or query failed"

      - name: Validate migrations applied (staging)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          COUNT=$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM \"_prisma_migrations\";" 2>/dev/null || echo "0")
          COUNT=$(echo "$COUNT" | tr -d '\r')
          echo "Staging applied migrations count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "No migrations applied on staging or migration table missing - failing" >&2
            exit 1
          fi

  build-and-deploy:
    name: Build backend image, push to ACR, deploy to Web App
    needs: [migrate-staging]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }} # e.g. myacr.azurecr.io
      IMAGE_NAME: ${{ secrets.BACKEND_APP_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache backend node modules (npm)
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install PostgreSQL client (for backup/restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Backup PostgreSQL (pg_dump)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_NAME: prisma_backup_${{ github.run_id }}.dump
        run: |
          set -euo pipefail
          echo "Creating DB backup to $BACKUP_NAME"
          pg_dump --format=custom --file="$BACKUP_NAME" "$DATABASE_URL"
          ls -lh "$BACKUP_NAME"

      - name: Upload DB backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: prisma-backup-${{ github.run_id }}
          path: backend/prisma_backup_${{ github.run_id }}.dump

      - name: Run Prisma migrations (safe deploy with rollback)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PATH: backend/prisma_backup_${{ github.run_id }}.dump
        run: |
          set -euo pipefail
          echo "Running prisma migrate deploy"
          if npx prisma migrate deploy; then
            echo "Prisma migrations applied successfully"
          else
            echo "Prisma migration failed! Attempting rollback using backup: $BACKUP_PATH" >&2
            if command -v pg_restore >/dev/null 2>&1; then
              echo "Restoring database from backup..."
              pg_restore --exit-on-error --clean --no-owner --dbname="$DATABASE_URL" "$BACKUP_PATH" && echo "Restore successful" || echo "Restore failed — manual intervention required" >&2
            else
              echo "pg_restore not available; cannot restore automatically" >&2
            fi
            exit 1
          fi

      - name: Log applied migrations (postgres)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Listing last 10 applied migrations (if table exists)..."
          if psql "$DATABASE_URL" -c "SELECT 1" > /dev/null 2>&1; then
            psql "$DATABASE_URL" -Atc "SELECT migration_name || ' | ' || finished_at FROM \"_prisma_migrations\" ORDER BY finished_at DESC LIMIT 10;" || echo "_prisma_migrations table not found or query failed"
          else
            echo "Database connectivity failed during migration logging" >&2
            exit 1
          fi

      - name: Check DB connectivity
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Verifying DB connectivity..."
          if ! psql "$DATABASE_URL" -c "SELECT 1" ; then
            echo "Postgres connectivity check failed" >&2
            exit 1
          fi

      - name: Validate migrations applied
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          COUNT=$(psql "$DATABASE_URL" -Atc "SELECT COUNT(*) FROM \"_prisma_migrations\";" 2>/dev/null || echo "0")
          COUNT=$(echo "$COUNT" | tr -d '\r')
          echo "Applied migrations count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "No migrations applied or migration table missing - failing deployment" >&2
            exit 1
          fi

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      - name: Azure Login (service principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configure Web App to use new container image
        run: |
          az webapp config container set \
            -g ${{ secrets.RESOURCE_GROUP }} \
            -n ${{ secrets.BACKEND_APP_NAME }} \
            --docker-custom-image-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }}

      - name: Set Web App settings (secure values from secrets)
        run: |
          az webapp config appsettings set -g ${{ secrets.RESOURCE_GROUP }} -n ${{ secrets.BACKEND_APP_NAME }} --settings \
            DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            NODE_ENV=production \
            CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}"

      - name: Restart Web App
        run: az webapp restart -g ${{ secrets.RESOURCE_GROUP }} -n ${{ secrets.BACKEND_APP_NAME }}

      - name: Wait for health endpoint
        run: |
          HEALTH_URL="https://${{ secrets.BACKEND_APP_NAME }}.azurewebsites.net/health"
          echo "Checking $HEALTH_URL"
          for i in {1..20}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $HEALTH_URL || true)
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Health OK"
              exit 0
            fi
            echo "Attempt $i: status=$HTTP_STATUS; retrying in 5s..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

      - name: Cleanup old caches (optional)
        if: always()
        run: echo "Job finished"

# Required repository secrets (set these in GitHub):
# - AZURE_CREDENTIALS => JSON from `az ad sp create-for-rbac --name "gh-actions-defendish" --role contributor --scopes /subscriptions/<sub>`
# - ACR_USERNAME, ACR_PASSWORD => from `az acr credential show -n <acr>`
# - ACR_LOGIN_SERVER => <acrName>.azurecr.io
# - RESOURCE_GROUP => resource group name (e.g., defendish-rg)
# - BACKEND_APP_NAME => Azure Web App name for backend
# - DATABASE_URL => Azure Postgres connection string (postgresql://...)
# - JWT_SECRET => production JWT secret
# - CORS_ORIGINS => comma-separated allowed origins
