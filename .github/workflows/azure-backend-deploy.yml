name: CI/CD — Backend → PostgreSQL Migrations

on:
  push:
    branches: [ main ]

jobs:
  migrate-staging:
    name: Migrate Staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Resolve failed migrations (if any)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          npx prisma migrate resolve --rolled-back 20251222071242_init 2>&1 || true
          npx prisma migrate resolve --rolled-back 20251229185247_add_profile_photo 2>&1 || true
      
      - name: Run migrations on staging
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1)
          MIGRATE_EXIT=$?
          echo "$MIGRATE_OUTPUT"
          if echo "$MIGRATE_OUTPUT" | grep -q 'Datasource "db": SQLite'; then
            echo "ERROR: Prisma targeting SQLite in CI" >&2
            exit 1
          fi
          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "Staging migration failed" >&2
            exit $MIGRATE_EXIT
          fi
      
      - name: Validate staging migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          DB_URL_CLEAN=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          COUNT=$(psql "$DB_URL_CLEAN" -Atc "SELECT COUNT(*) FROM \"_prisma_migrations\";" 2>/dev/null || echo "0")
          COUNT=$(echo "$COUNT" | tr -d '\r')
          echo "✅ Staging: $COUNT migrations applied"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No migrations applied" >&2
            exit 1
          fi

  migrate-production:
    name: Migrate Production
    needs: [migrate-staging]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      
      - name: Run migrations on production
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1)
          MIGRATE_EXIT=$?
          echo "$MIGRATE_OUTPUT"
          if echo "$MIGRATE_OUTPUT" | grep -q 'Datasource "db": SQLite'; then
            echo "ERROR: Prisma targeting SQLite in CI" >&2
            exit 1
          fi
          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "Production migration failed" >&2
            exit $MIGRATE_EXIT
          fi
      
      - name: Validate production migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DB_URL_CLEAN=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          psql "$DB_URL_CLEAN" -c "SELECT 'Database connected OK' as status;" || exit 1
          COUNT=$(psql "$DB_URL_CLEAN" -Atc "SELECT COUNT(*) FROM \"_prisma_migrations\";" 2>/dev/null || echo "0")
          COUNT=$(echo "$COUNT" | tr -d '\r')
          echo "✅ Production: $COUNT migrations applied"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "ERROR: No migrations applied" >&2
            exit 1
          fi
