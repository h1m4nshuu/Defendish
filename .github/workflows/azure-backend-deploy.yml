name: CI/CD — Backend → Azure

on:
  push:
    branches: [ main ]

jobs:
  migrate-staging:
    name: Migrate — Staging
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Resolve any failed migrations (staging)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set +e
          # Try to resolve any failed migrations by rolling them back
          npx prisma migrate resolve --rolled-back 20251222071242_init 2>&1 || true
          npx prisma migrate resolve --rolled-back 20251229185247_add_profile_photo 2>&1 || true
          npx prisma migrate resolve --rolled-back 20251230000000_add_profile_photo 2>&1 || true
          set -e

      - name: Run Prisma migrations on Staging
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Running prisma migrate deploy against STAGING"
          set +e
          MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1)
          MIGRATE_EXIT=$?
          set -e
          echo "$MIGRATE_OUTPUT"
          if echo "$MIGRATE_OUTPUT" | grep -q 'Datasource "db": SQLite'; then
            echo "Prisma is targeting SQLite in CI. Refusing to continue." >&2
            exit 1
          fi
          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "Staging migration failed" >&2
            exit $MIGRATE_EXIT
          fi

      - name: Log applied migrations (staging)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Listing last 10 applied migrations (staging)..."
          DATABASE_URL_PSQL=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          psql "$DATABASE_URL_PSQL" -Atc "SELECT migration_name || ' | ' || finished_at FROM \"_prisma_migrations\" ORDER BY finished_at DESC LIMIT 10;" || echo "_prisma_migrations table not found or query failed"

      - name: Validate migrations applied (staging)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_URL_PSQL=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          COUNT=$(psql "$DATABASE_URL_PSQL" -Atc "SELECT COUNT(*) FROM \"_prisma_migrations\";" 2>/dev/null || echo "0")
          COUNT=$(echo "$COUNT" | tr -d '\r')
          echo "Staging applied migrations count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "No migrations applied on staging or migration table missing - failing" >&2
            exit 1
          fi

  build-and-deploy:
    name: Build backend image, push to ACR, deploy to Web App
    needs: [migrate-staging]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
      IMAGE_NAME: ${{ secrets.BACKEND_APP_NAME }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Cache backend node modules (npm)
        uses: actions/cache@v4
        with:
          path: |
            backend/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run Prisma migrations (production)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Running prisma migrate deploy on PRODUCTION"
          set +e
          MIGRATE_OUTPUT=$(npx prisma migrate deploy 2>&1)
          MIGRATE_EXIT=$?
          set -e
          echo "$MIGRATE_OUTPUT"
          if echo "$MIGRATE_OUTPUT" | grep -q 'Datasource "db": SQLite'; then
            echo "Prisma is targeting SQLite in CI. Refusing to continue." >&2
            exit 1
          fi
          if [ $MIGRATE_EXIT -ne 0 ]; then
            echo "Production migration failed" >&2
            exit $MIGRATE_EXIT
          fi

      - name: Log applied migrations (production)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          echo "Listing last 10 applied migrations (production)..."
          DATABASE_URL_PSQL=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          psql "$DATABASE_URL_PSQL" -Atc "SELECT migration_name || ' | ' || finished_at FROM \"_prisma_migrations\" ORDER BY finished_at DESC LIMIT 10;" || echo "_prisma_migrations table not found or query failed"

      - name: Check DB connectivity
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_URL_PSQL=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          psql "$DATABASE_URL_PSQL" -c "SELECT 'Database connected successfully' as status;" || exit 1

      - name: Validate migrations applied (production)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          DATABASE_URL_PSQL=$(echo "$DATABASE_URL" | sed -E 's/([?&])schema=[^&]*&?/\1/g; s/[?&]$//; s/\?&/\?/g')
          COUNT=$(psql "$DATABASE_URL_PSQL" -Atc "SELECT COUNT(*) FROM \"_prisma_migrations\";" 2>/dev/null || echo "0")
          COUNT=$(echo "$COUNT" | tr -d '\r')
          echo "Production applied migrations count: $COUNT"
          if [ -z "$COUNT" ] || [ "$COUNT" -lt 1 ]; then
            echo "No migrations applied on production or migration table missing - failing" >&2
            exit 1
          fi

      - name: Build backend Docker image
        run: |
          cd backend
          docker build -t $REGISTRY/$IMAGE_NAME:$IMAGE_TAG -f Dockerfile .
          docker tag $REGISTRY/$IMAGE_NAME:$IMAGE_TAG $REGISTRY/$IMAGE_NAME:latest

      - name: Login to ACR
        run: |
          echo ${{ secrets.ACR_PASSWORD }} | docker login -u ${{ secrets.ACR_USERNAME }} --password-stdin $REGISTRY

      - name: Push image to ACR
        run: |
          docker push $REGISTRY/$IMAGE_NAME:$IMAGE_TAG
          docker push $REGISTRY/$IMAGE_NAME:latest

      - name: Summary
        run: |
          echo "✅ Staging migrations validated"
          echo "✅ Production migrations deployed"
          echo "✅ Backend image built and pushed to ACR"
          echo "Container image: $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
